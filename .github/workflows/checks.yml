name: Product checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: product-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      full: ${{ steps.scope.outputs.full }}
      image: ${{ steps.scope.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s deploy -p 'ci_policy_test.py'
      - run: python3 scripts/check-artifacts.py
      - id: scope
        run: python3 deploy/ci-policy.py

  frontend:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build production website image
        if: needs.scope.outputs.image == 'true'
        run: docker build --tag cutmy-web:ci .
      - run: npm test
      - run: npm run test:e2e-contract-types
      - run: npm run test:deploy
      - run: npm audit
      - name: Validate deployment shell scripts and local Compose
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          POSTGRES_PASSWORD=ci_config_only docker compose -f deploy/compose.dev.yaml config --quiet
      - name: Save distributable website
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cutmyvideo-web-dist
          path: dist/
          retention-days: 3
          if-no-files-found: error

  database-access:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: web
      - id: core-ref
        run: echo "sha=$(cat web/core.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Kay0k1/cutmyvideo-core
          ref: ${{ steps.core-ref.outputs.sha }}
          path: core
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - name: Build actual maintenance command
        working-directory: core
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/cutmy-role-core ./cmd/cutmy
      - name: Verify database privileges and migrations in isolated PostgreSQL
        working-directory: web
        run: |
          set -euo pipefail
          container=cutmy-role-audit-ci
          cleanup() { docker rm -f -v "$container" > /dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" --network none \
            -e POSTGRES_USER=cutmy -e POSTGRES_DB=cutmy \
            -e POSTGRES_PASSWORD=cutmy_ci_role_only \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -p 5432 -U cutmy -d cutmy; then ready=true; break; fi
            sleep 1
          done
          [[ "$ready" == true ]]
          CUTMY_DATABASE_TEST_CONTAINER="$container" \
          CUTMY_DATABASE_TEST_CORE_BINARY=/tmp/cutmy-role-core \
            python3 -m unittest discover -s deploy -p 'database_access_test.py'

  integration:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile, layout-chromium, layout-firefox, usability-chromium, usability-firefox]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: cutmy
          POSTGRES_PASSWORD: cutmy_ci_only
          POSTGRES_DB: cutmy
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U cutmy -d cutmy"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://cutmy:cutmy_ci_only@postgres:5432/cutmy?sslmode=disable
      DATA_DIR: /tmp/cutmy-ci-data
      PUBLIC_ORIGIN: http://127.0.0.1:5173
      COOKIE_SECURE: 'false'
      MUTATIONS_PER_MINUTE: '10000'
      MAX_OUTPUT_BYTES: '16777216'
      MAX_SOURCE_BYTES: '67108864'
      MAX_STORAGE_BYTES: '2147483648'
      MAX_OWNER_BYTES: '536870912'
      STORAGE_SAFETY_BYTES: '67108864'
      CUTMY_E2E_URL: http://127.0.0.1:5173
      CUTMY_E2E_DATABASE_CONTROL: hosted-disposable
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Prepare browser user directory
        run: chown "$(id -u):$(id -g)" -- "$HOME"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: web
      - id: core-ref
        run: echo "sha=$(cat web/core.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Kay0k1/cutmyvideo-core
          ref: ${{ steps.core-ref.outputs.sha }}
          path: core
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install media tools
        run: |
          apt-get update -qq
          apt-get install -y ffmpeg postgresql-client
      - run: go build -o /tmp/cutmy ./cmd/cutmy
        working-directory: core
      - run: npm ci
        working-directory: web
      - name: Collect the complete browser project inventory
        working-directory: web
        run: |
          mkdir "$RUNNER_TEMP/browser-evidence"
          printf 'CUTMY_E2E_JSON_OUTPUT=%s\n' "$RUNNER_TEMP/browser-evidence/tests.json" >> "$GITHUB_ENV"
          node node_modules/@playwright/test/cli.js test --config=e2e/playwright.config.ts --project="${{ matrix.project }}" --list --reporter=json > "$RUNNER_TEMP/browser-evidence/inventory.json"
      - name: Start real backend and website
        run: |
          /tmp/cutmy server > /tmp/cutmy-server.log 2>&1 &
          backend_ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz; then backend_ready=true; break; fi
            sleep 1
          done
          if [ "$backend_ready" != true ]; then cat /tmp/cutmy-server.log; exit 1; fi
          /tmp/cutmy worker > /tmp/cutmy-worker.log 2>&1 &
          cd web
          npm run dev -- --host 127.0.0.1 > /tmp/cutmy-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz && curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cutmy-server.log /tmp/cutmy-web.log
          exit 1
      - name: Verify actual database fault contract first
        if: matrix.project == 'desktop'
        env:
          CUTMY_E2E_JSON_OUTPUT: ${{ runner.temp }}/browser-evidence/contract.json
        run: xvfb-run -a --server-args='-screen 0 2560x1440x24' npm run test:e2e -- --headed --project=desktop --grep='current core database contract'
        working-directory: web
      - name: Run isolated browser project with a virtual display
        run: xvfb-run -a --server-args='-screen 0 2560x1440x24' npm run test:e2e -- --headed --project="${{ matrix.project }}" --grep-invert='current core database contract'
        working-directory: web
      - name: Require every collected case in this project
        working-directory: web
        run: |
          reports=("$RUNNER_TEMP/browser-evidence/tests.json")
          if [ "${{ matrix.project }}" = desktop ]; then reports+=("$RUNNER_TEMP/browser-evidence/contract.json"); fi
          python3 deploy/browser-coverage.py --project "${{ matrix.project }}" --inventory "$RUNNER_TEMP/browser-evidence/inventory.json" --reports "${reports[@]}" --output "$RUNNER_TEMP/browser-evidence/coverage.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-evidence/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-diagnostics-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
            /tmp/cutmy-server.log
            /tmp/cutmy-worker.log
          retention-days: 3

  # WebKit media decoding uses the host platform. Playwright recommends macOS
  # for video playback closest to Safari; retain the entire real-media matrix.
  integration-webkit:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [layout-webkit, usability-webkit]
    defaults:
      run:
        shell: bash
    env:
      DATABASE_URL: postgres://cutmy:cutmy_ci_only@127.0.0.1:55434/cutmy?sslmode=disable
      PUBLIC_ORIGIN: http://127.0.0.1:5173
      COOKIE_SECURE: 'false'
      MUTATIONS_PER_MINUTE: '10000'
      MAX_OUTPUT_BYTES: '16777216'
      MAX_SOURCE_BYTES: '67108864'
      MAX_STORAGE_BYTES: '2147483648'
      MAX_OWNER_BYTES: '536870912'
      STORAGE_SAFETY_BYTES: '67108864'
      CUTMY_E2E_URL: http://127.0.0.1:5173
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Prepare owned integration directories
        run: |
          cutmy_ci_path="$RUNNER_TEMP/cutmy-webkit-ci"
          mkdir -p "$cutmy_ci_path"
          {
            printf 'CUTMY_CI_DIR=%s\n' "$cutmy_ci_path"
            printf 'PGDATA=%s\n' "$cutmy_ci_path/postgres"
            printf 'DATA_DIR=%s\n' "$cutmy_ci_path/data"
            printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$cutmy_ci_path/browsers"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: web
      - id: core-ref
        run: echo "sha=$(cat web/core.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Kay0k1/cutmyvideo-core
          ref: ${{ steps.core-ref.outputs.sha }}
          path: core
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install native database and media tools
        run: |
          brew install postgresql@17 ffmpeg
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
      - name: Start owned PostgreSQL on loopback
        run: |
          initdb -D "$PGDATA" -U cutmy --auth=trust
          pg_ctl -D "$PGDATA" -l "$CUTMY_CI_DIR/postgres.log" -o "-h 127.0.0.1 -p 55434 -k ''" -w start
          PGPASSWORD=cutmy_ci_only createdb -h 127.0.0.1 -p 55434 -U cutmy cutmy
      - run: go build -o "$CUTMY_CI_DIR/cutmy" ./cmd/cutmy
        working-directory: core
      - run: npm ci
        working-directory: web
      - name: Collect the complete browser project inventory
        working-directory: web
        run: |
          mkdir "$RUNNER_TEMP/browser-evidence"
          printf 'CUTMY_E2E_JSON_OUTPUT=%s\n' "$RUNNER_TEMP/browser-evidence/tests.json" >> "$GITHUB_ENV"
          node node_modules/@playwright/test/cli.js test --config=e2e/playwright.config.ts --project="${{ matrix.project }}" --list --reporter=json > "$RUNNER_TEMP/browser-evidence/inventory.json"
      - run: npx playwright install webkit
        working-directory: web
      - name: Start real backend and website
        working-directory: web
        run: |
          start_owned() {
            python3 - "$1" "${@:2}" <<'PYTHON'
          import json, os, subprocess, sys
          from pathlib import Path
          directory = Path(os.environ['CUTMY_CI_DIR'])
          role, command = sys.argv[1], sys.argv[2:]
          with (directory / f'{role}.log').open('wb') as log:
              process = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
          (directory / f'{role}-process.json').write_text(json.dumps({'pid': process.pid, 'command': ' '.join(command)}))
          PYTHON
          }
          start_owned server "$CUTMY_CI_DIR/cutmy" server
          backend_ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz; then backend_ready=true; break; fi
            sleep 1
          done
          if [ "$backend_ready" != true ]; then cat "$CUTMY_CI_DIR/server.log"; exit 1; fi
          start_owned worker "$CUTMY_CI_DIR/cutmy" worker
          start_owned web "$(command -v node)" "$GITHUB_WORKSPACE/web/node_modules/vite/bin/vite.js" --host 127.0.0.1
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz && curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$CUTMY_CI_DIR/server.log" "$CUTMY_CI_DIR/web.log"
          exit 1
      - name: Run isolated native macOS WebKit project
        run: |
          # macOS otherwise excludes native buttons from Tab navigation.
          # Limit Keyboard Navigation to this disposable Playwright app domain.
          keyboard_mode=$(defaults read org.webkit.Playwright AppleKeyboardUIMode 2>/dev/null || true)
          if [[ -n "$keyboard_mode" && ! "$keyboard_mode" =~ ^[0-9]+$ ]]; then
            echo 'Unexpected previous keyboard-navigation preference'; exit 1
          fi
          restore_keyboard_mode() {
            if [[ -n "$keyboard_mode" ]]; then
              defaults write org.webkit.Playwright AppleKeyboardUIMode -int "$keyboard_mode"
            else
              defaults delete org.webkit.Playwright AppleKeyboardUIMode > /dev/null 2>&1 || true
            fi
          }
          trap restore_keyboard_mode EXIT
          defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
          [[ $(defaults read org.webkit.Playwright AppleKeyboardUIMode) == 2 ]]
          npm run test:e2e -- --project="${{ matrix.project }}"
        working-directory: web
      - name: Require every collected case in this project
        working-directory: web
        run: python3 deploy/browser-coverage.py --project "${{ matrix.project }}" --inventory "$RUNNER_TEMP/browser-evidence/inventory.json" --reports "$RUNNER_TEMP/browser-evidence/tests.json" --output "$RUNNER_TEMP/browser-evidence/coverage.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-evidence-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-evidence/
          retention-days: 3
          if-no-files-found: error
      - name: Stop only owned backend and website
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os, signal, subprocess, time
          from pathlib import Path
          directory = Path(os.environ['CUTMY_CI_DIR'])
          owned = []
          def matches(process):
              try:
                  state, command = subprocess.check_output(['ps', '-p', str(process['pid']), '-o', 'stat=', '-o', 'command='], text=True).strip().split(None, 1)
                  if state.startswith('Z'):
                      return False
                  if os.getpgid(process['pid']) != process['pid'] or command != process['command']:
                      raise RuntimeError('Owned process identity changed; refusing termination')
                  return True
              except (ProcessLookupError, subprocess.CalledProcessError):
                  return False
          for path in directory.glob('*-process.json'):
              process = json.loads(path.read_text())
              if matches(process):
                  os.killpg(process['pid'], signal.SIGTERM)
                  owned.append(process)
          deadline = time.monotonic() + 10
          while any(matches(process) for process in owned) and time.monotonic() < deadline:
              time.sleep(.1)
          for process in owned:
              if matches(process):
                  os.killpg(process['pid'], signal.SIGKILL)
          PYTHON
      - name: Stop owned PostgreSQL
        if: always()
        run: |
          if command -v pg_ctl > /dev/null && [ -d "$PGDATA" ]; then
            if pg_ctl -D "$PGDATA" status > /dev/null 2>&1; then
              pg_ctl -D "$PGDATA" -m fast -w stop
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: native-webkit-diagnostics-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
            ${{ runner.temp }}/cutmy-webkit-ci/server.log
            ${{ runner.temp }}/cutmy-webkit-ci/worker.log
            ${{ runner.temp }}/cutmy-webkit-ci/web.log
            ${{ runner.temp }}/cutmy-webkit-ci/postgres.log
          retention-days: 3

  browser-gate:
    name: Complete browser coverage
    needs: [scope, frontend, database-access, integration, integration-webkit]
    # Observe failed/skipped prerequisites, but do not keep cancelled runs alive.
    if: ${{ !cancelled() && needs.scope.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite
        env:
          PREREQUISITES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = {name: value['result'] for name, value in json.loads(os.environ['PREREQUISITES']).items()}
          print(json.dumps(results))
          if set(results.values()) != {'success'}:
              raise SystemExit('Browser prerequisites failed, were cancelled or skipped')
          PYTHON
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-reports
      - name: Require the full inventory across all eight browser projects
        run: |
          node node_modules/@playwright/test/cli.js test --config=e2e/playwright.config.ts --list --reporter=json > "$RUNNER_TEMP/browser-inventory.json"
          reports=("$RUNNER_TEMP/browser-reports"/*/tests.json "$RUNNER_TEMP/browser-reports"/*/contract.json)
          python3 deploy/browser-coverage.py --inventory "$RUNNER_TEMP/browser-inventory.json" --reports "${reports[@]}" --output "$RUNNER_TEMP/browser-coverage.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-coverage.json
          if-no-files-found: error
          retention-days: 3
