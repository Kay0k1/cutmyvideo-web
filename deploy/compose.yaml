name: cutmy

x-core: &core
  image: cutmy-core:${RELEASE_TAG:-local}
  restart: on-failure:5
  init: true
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
  environment: &core-env
    DATABASE_URL: postgres://cutmy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/cutmy?sslmode=disable
    DATA_DIR: /data
    LISTEN_ADDR: :8080
    PUBLIC_ORIGIN: https://${DOMAIN:-cutmy.video}
    COOKIE_SECURE: "true"
    TRUST_PROXY: "true"
    XDG_CACHE_HOME: /tmp/cache
    MAX_STORAGE_BYTES: "${MAX_STORAGE_BYTES:-103079215104}"
    MAX_SOURCE_BYTES: "${MAX_SOURCE_BYTES:-34359738368}"
    MAX_FETCH_BYTES: "${MAX_FETCH_BYTES:-34359738368}"
    MAX_RANGE_MS: "${MAX_RANGE_MS:-43200000}"
    MAX_JOB_MS: "${MAX_JOB_MS:-86400000}"
    MAX_RANGES: "${MAX_RANGES:-32}"
    JOB_TIMEOUT: "${JOB_TIMEOUT:-12h}"
    SOURCE_TIMEOUT: "${SOURCE_TIMEOUT:-2m}"
    UPLOAD_TIMEOUT: "${UPLOAD_TIMEOUT:-2h}"
    MAX_OUTPUT_BYTES: "${MAX_OUTPUT_BYTES:-17179869184}"
    MAX_OWNER_BYTES: "${MAX_OWNER_BYTES:-68719476736}"
    STORAGE_SAFETY_BYTES: "${STORAGE_SAFETY_BYTES:-536870912}"
    STORAGE_WAIT_TIMEOUT: "${STORAGE_WAIT_TIMEOUT:-30m}"
    SOURCE_TTL: "${SOURCE_TTL:-24h}"
    ARTIFACT_TTL: "${ARTIFACT_TTL:-24h}"
    WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
    FFMPEG_THREADS: "${FFMPEG_THREADS:-2}"
    FFMPEG_PROFILE: "${FFMPEG_PROFILE:-fast}"
  volumes:
    - media:/data
  security_opt:
    - no-new-privileges:true
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
  logging: &logs
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: cutmy
      POSTGRES_DB: cutmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -p 5432 -U cutmy -d cutmy"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    cpus: 1
    logging: *logs
    networks:
      processing:
        ipv4_address: 172.30.240.12

  api:
    <<: *core
    build:
      context: ${CORE_CONTEXT:-../../core}
      # Keep these release identifiers aligned with the immutable core.version pin.
      args:
        VERSION: v1.2.0+editor.20261012
        VCS_REF: 30cef70191c5f60e77fbc8aa84f8e05ca35485d9
        BUILD_TIME: "2026-10-12T17:16:06Z"
    command: [server]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/cutmy, healthcheck]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    networks:
      processing:
        ipv4_address: 172.30.240.10

  worker:
    <<: *core
    command: [worker]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/cutmy, worker-healthcheck]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
    mem_limit: 4g
    cpus: 3
    pids_limit: 256
    networks:
      processing:
        ipv4_address: 172.30.240.11

  web:
    image: cutmy-web:${RELEASE_TAG:-local}
    build:
      context: ..
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
    logging: *logs
    networks:
      - processing

  edge:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-cutmy.video}
      MAX_UPLOAD_BODY_BYTES: "${MAX_UPLOAD_BODY_BYTES:-1075838976}"
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging: *logs
    networks:
      - processing

networks:
  processing:
    name: cutmy-processing-v1
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.240.0/24

volumes:
  database:
    name: cutmy-database
  media:
    name: cutmy-media
  certificates:
    name: cutmy-certificates
  caddy_config:
    name: cutmy-caddy-config
